<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact Us — Atlas Lighting & Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--surface:#FAFAF8;--surface-2:#F3F2EE;
    --hair:#E5E5E2;--text:#1F1F1F;--text-2:#4A4A4A;--text-3:#777777;
    --accent:#2C2C2C;--accent-dark:#000;
    --f-sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --f-script:'Pinyon Script',cursive;
    --t-fast:.18s ease;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--f-sans);color:var(--text);background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px}
  @media (max-width:760px){.wrap{padding:0 18px}}

  header.site-header{background:#f6f6f6;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:50}
  .hdr-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:20px 0}
  .hdr-logo{display:flex;flex-direction:column;align-items:center;line-height:1}
  .hdr-logo .script{font-family:var(--f-script);font-size:64px;color:var(--accent);line-height:.9}
  .hdr-logo .sub{font-family:var(--f-sans);font-weight:600;font-size:14px;letter-spacing:.32em;color:var(--accent);margin-top:3px}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
  .icon-btn:hover{background:var(--surface-2)}
  .icon-btn svg{width:22px;height:22px}
  .hdr-right{display:flex;gap:8px;justify-content:flex-end}

  /* Contact page */
  .contact-page{padding:48px 0 80px}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:flex-start}
  @media (max-width:900px){.contact-grid{grid-template-columns:1fr;gap:36px}}

  .cu-title{font-family:var(--f-sans);font-size:clamp(28px,3vw,42px);font-weight:700;letter-spacing:.06em;color:var(--text);text-transform:uppercase;margin:0 0 20px}
  .cu-intro{color:var(--text-2);font-size:15.5px;margin:0 0 28px;max-width:520px}
  .cu-divider{border-top:1px solid var(--hair);margin:8px 0 28px;max-width:560px}
  .cu-info{display:flex;flex-direction:column;gap:18px;font-size:15px;color:var(--text-2)}
  .cu-info a{color:var(--text-2);display:flex;align-items:center;gap:14px;line-height:1.45}
  .cu-info a:hover{color:var(--text)}
  .cu-info svg{width:20px;height:20px;flex-shrink:0;color:var(--text-2)}

  /* Form */
  .cu-form{display:flex;flex-direction:column;gap:16px;max-width:620px}
  .cu-form input,.cu-form textarea{
    width:100%;padding:18px 18px 6px;
    border:1px solid var(--hair);background:#fff;border-radius:3px;
    font-family:inherit;font-size:14.5px;color:var(--text);
    transition:border-color var(--t-fast);
  }
  .cu-form textarea{padding-top:24px;height:140px;resize:vertical}
  .field-wrap{position:relative}
  .field-wrap label{
    position:absolute;left:18px;top:14px;
    font-size:13px;color:var(--text-3);font-weight:500;
    pointer-events:none;background:#fff;padding:0 4px;
    transition:all var(--t-fast);
  }
  .field-wrap input:focus,.field-wrap textarea:focus,
  .field-wrap input:not(:placeholder-shown),.field-wrap textarea:not(:placeholder-shown){
    outline:none;border-color:var(--accent);
  }
  .field-wrap input:focus + label,.field-wrap textarea:focus + label,
  .field-wrap input:not(:placeholder-shown) + label,.field-wrap textarea:not(:placeholder-shown) + label{
    top:-7px;font-size:11px;color:var(--text);font-weight:600;
  }
  .send-btn{
    width:100%;padding:18px;background:var(--accent);color:#fff;
    border-radius:3px;font-size:14px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;margin-top:8px;
    transition:background var(--t-fast);
  }
  .send-btn:hover{background:#000}

  footer.site-footer{background:#F2F0EC;color:#5B5B58;padding:36px 0 0;border-top:1px solid #E5E2DA;margin-top:48px}
  .ft-bottom{padding:16px 0;border-top:1px solid #E5E2DA;background:#EAE7DF;font-size:13.5px;color:#5B5B58}
  .ft-bottom .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  .ft-bottom a{color:#5B5B58;margin-left:22px}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="hdr-row">
      <div></div>
      <a class="hdr-logo" href="index.html"><span class="script">Atlas</span><span class="sub">LIGHTING &amp; HOME</span></a>
      <div class="hdr-right">
        <a class="icon-btn" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg></a>
        <a class="icon-btn" href="cart.html" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></a>
      </div>
    </div>
  </div>
</header>

<main class="contact-page">
  <div class="wrap">
    <div class="contact-grid">

      <div>
        <h1 class="cu-title">Contact Us</h1>
        <p class="cu-intro">Thank you for your interest in Atlas Lighting and Home. We'd love to hear from you!</p>
        <div class="cu-divider"></div>
        <div class="cu-info">
          <a href="https://maps.app.goo.gl/2jRZHGWsekFx4moc6">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
            1473 Yorkhouse Road, Rabun Gap, GA 30568
          </a>
          <a href="tel:+7624028527">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.95.36 1.88.7 2.78a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.3-1.27a2 2 0 0 1 2.11-.45c.9.34 1.83.57 2.78.7A2 2 0 0 1 22 16.92z"/></svg>
            (762) 40-ATLAS
          </a>
          <a href="mailto:sales@atlaslightingandhome.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
            sales@atlaslightingandhome.com
          </a>
        </div>
      </div>

      <form class="cu-form" onsubmit="event.preventDefault();alert('Demo: message sent');this.reset()">
        <div class="field-wrap">
          <input type="email" id="email" placeholder=" " required>
          <label for="email">Email *</label>
        </div>
        <div class="field-wrap">
          <input type="text" id="name" placeholder=" " required>
          <label for="name">Name *</label>
        </div>
        <div class="field-wrap">
          <input type="text" id="subject" placeholder=" ">
          <label for="subject">Subject</label>
        </div>
        <div class="field-wrap">
          <textarea id="message" placeholder=" "></textarea>
          <label for="message">Message</label>
        </div>
        <button class="send-btn" type="submit">Send</button>
      </form>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="ft-bottom">
    <div class="wrap">
      <span>Powered by Wizcommerce. All rights reserved.</span>
      <span><a href="#">Privacy Policy</a><a href="#">Terms &amp; Conditions</a><a href="#">Accessibility</a></span>
    </div>
  </div>
</footer>
</body>
</html>

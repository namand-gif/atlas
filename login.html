<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In — Atlas Lighting & Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--surface:#FAFAF8;--surface-2:#F3F2EE;
    --hair:#E5E5E2;--text:#1F1F1F;--text-2:#4A4A4A;--text-3:#777777;
    --accent:#2C2C2C;--accent-dark:#000;
    --f-sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --f-script:'Pinyon Script',cursive;
    --t-fast:.18s ease;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--f-sans);color:var(--text);background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px}
  @media (max-width:760px){.wrap{padding:0 18px}}

  /* Full Atlas site header (matches main site) */
  header.site-header{background:#f6f6f6;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:50}
  .hdr-top-strip{border-bottom:1px solid var(--hair);background:#f6f6f6}
  .hdr-top-strip .wrap{min-height:24px;padding:14px 28px}
  .hdr-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:20px 0}
  .hdr-logo{display:flex;flex-direction:column;align-items:center;line-height:1}
  .hdr-logo .script{font-family:var(--f-script);font-size:80px;color:var(--accent);line-height:.9}
  .hdr-logo .sub{font-family:var(--f-sans);font-weight:600;font-size:17px;letter-spacing:.32em;color:var(--accent);margin-top:4px}
  .hdr-logo .tag{font-size:11.5px;letter-spacing:.22em;color:var(--text-3);margin-top:4px;text-transform:uppercase}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
  .icon-btn:hover{background:var(--surface-2)}
  .icon-btn svg{width:22px;height:22px}
  .hdr-right{display:flex;gap:8px;justify-content:flex-end}
  .hdr-nav{border-top:1px solid var(--hair);background:#f6f6f6}
  .hdr-nav .wrap{display:flex;justify-content:center;padding:12px 0;gap:36px}
  .nav-link{font-size:15px;font-weight:500;color:var(--text);padding:8px 0;border-bottom:2px solid transparent;transition:border-color var(--t-fast)}
  .nav-link:hover{border-bottom-color:var(--accent)}
  @media (max-width:900px){.hdr-top-strip,.hdr-nav{display:none}.hdr-row{padding:14px 0}.hdr-logo .script{font-size:54px}.hdr-logo .sub{font-size:13px;letter-spacing:.28em}.hdr-logo .tag{display:none}}

  /* Login card */
  .auth-wrap{
    min-height:calc(100vh - 360px);
    display:flex;align-items:center;justify-content:center;
    padding:48px 18px;background:#fff;
  }
  .auth-card{
    background:#fff;
    width:100%;max-width:540px;
    padding:52px 60px 44px;
    border:1px solid var(--hair);
    border-radius:6px;
    box-shadow:0 4px 22px rgba(0,0,0,.04);
  }
  @media (max-width:560px){.auth-card{padding:36px 24px}}

  h1.auth-title{
    font-family:var(--f-sans);
    font-size:clamp(24px,2.4vw,30px);font-weight:500;
    text-align:center;color:var(--text);
    margin:0 0 36px;letter-spacing:.01em;
  }

  /* Floating-label fields */
  .field{position:relative;margin-bottom:22px}
  .field input{
    width:100%;
    border:0;border-bottom:1px solid var(--hair);
    background:transparent;
    padding:18px 0 10px;font-family:inherit;
    font-size:15px;color:var(--text);outline:none;
    transition:border-color var(--t-fast);
  }
  .field input:focus{border-bottom-color:var(--accent);border-bottom-width:2px;padding-bottom:9px}
  .field label{
    position:absolute;left:0;top:18px;
    font-size:14.5px;color:var(--text-3);
    pointer-events:none;background:transparent;
    transition:all .2s ease;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:0;font-size:11.5px;color:var(--text-2);font-weight:500;
  }
  .pwd-wrap{position:relative}
  .pwd-toggle{
    position:absolute;right:0;top:14px;
    width:36px;height:32px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--text-3);
  }
  .pwd-toggle:hover{color:var(--text)}
  .pwd-toggle svg{width:20px;height:20px}

  .forgot{
    text-align:center;margin:10px 0 28px;
  }
  .forgot a{color:var(--text-2);font-size:13.5px;border-bottom:1px solid transparent;padding:2px 0}
  .forgot a:hover{color:var(--text);border-bottom-color:var(--text)}

  .login-btn{
    width:100%;padding:18px;background:var(--accent);color:#fff;
    border-radius:3px;font-size:14px;font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;
    transition:background var(--t-fast);
  }
  .login-btn:hover{background:var(--accent-dark)}

  .signup-row{margin-top:22px;text-align:center;font-size:14px;color:var(--text-2)}
  .signup-row a{color:var(--text);font-weight:600;border-bottom:1px solid var(--text);margin-left:4px}

  /* Footer */
  footer.site-footer{background:#F2F0EC;color:#5B5B58;padding:36px 0 0;border-top:1px solid #E5E2DA}
  .ft-bottom{padding:16px 0;border-top:1px solid #E5E2DA;background:#EAE7DF;font-size:13.5px;color:#5B5B58}
  .ft-bottom .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  .ft-bottom a{color:#5B5B58;margin-left:22px}
</style>
</head>
<body>

<header class="site-header">
  <div class="hdr-top-strip"><div class="wrap"></div></div>
  <div class="hdr-main">
    <div class="wrap">
      <div class="hdr-row">
        <div></div>
        <a class="hdr-logo" href="index.html">
          <span class="script">Atlas</span>
          <span class="sub">LIGHTING &amp; HOME</span>
          <span class="tag">Artistry through lighting and style</span>
        </a>
        <div class="hdr-right">
          <a class="icon-btn" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg></a>
          <a class="icon-btn" href="cart.html" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></a>
        </div>
      </div>
    </div>
  </div>
  <div class="hdr-nav">
    <div class="wrap">
      <a class="nav-link" href="index.html#">Lighting</a>
      <a class="nav-link" href="index.html#">Decor</a>
      <a class="nav-link" href="index.html#">Furniture</a>
      <a class="nav-link" href="index.html#">Clearance</a>
      <a class="nav-link" href="contact.html">Contact Us</a>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <section class="auth-card">

    <h1 class="auth-title">Login to Your Account</h1>

    <form onsubmit="event.preventDefault();location.href='profile.html'">
      <div class="field">
        <input type="email" id="email" placeholder=" " autocomplete="email" required />
        <label for="email">Email*</label>
      </div>
      <div class="field pwd-wrap">
        <input type="password" id="pwd" placeholder=" " autocomplete="current-password" required />
        <label for="pwd">Password*</label>
        <button type="button" class="pwd-toggle" aria-label="Show password"
          onclick="const p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password';">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8S2 12 2 12z" stroke-dasharray="40 6" stroke-dashoffset="0"/><circle cx="12" cy="12" r="3"/><line x1="4" y1="20" x2="20" y2="4" stroke-width="1.6"/></svg>
        </button>
      </div>

      <div class="forgot"><a href="#">Forgot Password?</a></div>

      <button class="login-btn" type="submit">Login</button>
    </form>

    <div class="signup-row">Don't have an account?<a href="signup.html">Signup</a></div>
  </section>
</main>

<footer class="site-footer">
  <div class="ft-bottom">
    <div class="wrap">
      <span>Powered by Wizcommerce. All rights reserved.</span>
      <span><a href="#">Privacy Policy</a><a href="#">Terms &amp; Conditions</a><a href="#">Accessibility</a></span>
    </div>
  </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login — Atlas Lighting & Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FAFAF8; --surface-2:#F3F2EE;
    --hair:#E5E5E2; --text:#1F1F1F; --text-2:#4A4A4A; --text-3:#777777;
    --accent:#5B6068; --accent-soft:#6B7078;
    --f-sans:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --f-script:'Pinyon Script', cursive;
    --t-fast:.18s ease;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--f-sans);color:var(--text);background:#fafaf8;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 18px;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none}

  .auth-card{
    background:#fff;
    width:100%;max-width:520px;
    padding:48px 48px 40px;
    border:1px solid var(--hair);
    border-radius:6px;
    box-shadow:0 4px 20px rgba(0,0,0,.04);
  }
  @media (max-width:560px){.auth-card{padding:32px 24px}}

  .brand{
    text-align:center;margin-bottom:36px;line-height:1;
    display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:14px;
  }
  .brand .script{font-family:var(--f-script);font-size:64px;color:var(--accent)}
  .brand .meta{display:flex;flex-direction:column;text-align:left;padding-bottom:14px}
  .brand .meta .sub{
    font-family:var(--f-sans);font-weight:600;font-size:18px;
    letter-spacing:.18em;color:var(--accent);
  }
  .brand .meta .tag{
    font-size:9px;letter-spacing:.18em;color:var(--text-3);
    text-transform:uppercase;margin-top:3px;
  }
  @media (max-width:480px){
    .brand{flex-direction:column;align-items:center;gap:4px}
    .brand .script{font-size:54px}
    .brand .meta{text-align:center;padding-bottom:0;align-items:center}
    .brand .meta .sub{font-size:15px}
  }

  h1.auth-title{
    font-family:var(--f-sans);
    font-size:22px;font-weight:600;text-align:center;
    color:var(--text);margin:0 0 32px;
  }

  .field{margin-bottom:18px}
  .field input{
    width:100%;padding:14px 16px;
    border:1px solid var(--hair);background:#fff;
    border-radius:3px;font-family:inherit;font-size:14.5px;color:var(--text);
    transition:border-color var(--t-fast);
  }
  .field input:focus{outline:none;border-color:var(--accent)}
  .field input::placeholder{color:var(--text-3)}

  .password-wrap{position:relative}
  .password-toggle{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:3px;
    display:inline-flex;align-items:center;justify-content:center;
    color:var(--text-3);
  }
  .password-toggle:hover{color:var(--text)}
  .password-toggle svg{width:20px;height:20px}

  .forgot{
    text-align:right;margin:6px 0 22px;
  }
  .forgot a{color:var(--text-2);font-size:13.5px;font-weight:500;border-bottom:1px solid transparent}
  .forgot a:hover{color:var(--text);border-bottom-color:var(--text)}

  .login-btn{
    width:100%;padding:15px;background:var(--accent);color:#fff;
    border-radius:3px;font-size:14px;font-weight:600;
    letter-spacing:.12em;transition:background var(--t-fast);
  }
  .login-btn:hover{background:#4a4f56}

  .signup-row{
    margin-top:22px;text-align:center;
    font-size:14px;color:var(--text-2);
  }
  .signup-row a{color:var(--text);font-weight:600;border-bottom:1px solid var(--text)}

  .back-home{
    position:absolute;top:24px;left:24px;
    font-size:13px;color:var(--text-2);
    display:inline-flex;align-items:center;gap:6px;
  }
  .back-home:hover{color:var(--text)}
  .back-home svg{width:14px;height:14px}
</style>
</head>
<body>

<a class="back-home" href="index.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  Back to site
</a>

<main class="auth-card">

  <div class="brand">
    <span class="script">Atlas</span>
    <div class="meta">
      <span class="sub">LIGHTING &amp; HOME</span>
      <span class="tag">Artistry through lighting and style</span>
    </div>
  </div>

  <h1 class="auth-title">Login to Atlas Lighting and Home</h1>

  <form onsubmit="event.preventDefault();alert('Demo: login submitted')">
    <div class="field">
      <input type="email" placeholder="Email" autocomplete="email" required />
    </div>
    <div class="field password-wrap">
      <input id="pwd" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="button" class="password-toggle" aria-label="Show password"
        onclick="const p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password';">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="forgot"><a href="#">Forgot Password?</a></div>
    <button class="login-btn" type="submit">Login</button>
  </form>

  <div class="signup-row">Don't have an account? <a href="#">Sign up</a></div>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign Up — Atlas Lighting & Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--surface:#FAFAF8;--surface-2:#F3F2EE;
    --hair:#E5E5E2;--text:#1F1F1F;--text-2:#4A4A4A;--text-3:#777777;
    --accent:#5B6068;--accent-dark:#454952;
    --f-sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --t-fast:.18s ease;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--f-sans);color:var(--text);background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15.5px;color:var(--text)}

  /* Top strip — light gray bar, no nav, no logo */
  .topbar{
    background:#F2F2F1;border-bottom:1px solid var(--hair);
    height:36px;
  }

  /* Page */
  .signup-page{padding:64px 28px 96px;background:#fff;min-height:calc(100vh - 36px - 110px)}
  .signup-card{max-width:640px;margin:0 auto}

  /* Header row — back arrow + title */
  .sp-head{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin-bottom:48px;
  }
  .sp-back{
    width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:4px;color:var(--text);
  }
  .sp-back:hover{background:var(--surface-2)}
  .sp-back svg{width:22px;height:22px}
  .sp-title{font-size:clamp(22px,2.2vw,28px);font-weight:700;color:var(--text);margin:0;letter-spacing:.01em}

  /* Stepper */
  .stepper{text-align:center;margin-bottom:46px}
  .step-dot{
    width:64px;height:64px;border-radius:999px;
    background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:600;margin:0 auto 16px;
  }
  .step-label{
    font-size:14.5px;font-weight:600;letter-spacing:.18em;
    color:var(--text);text-transform:uppercase;
  }

  /* Form */
  .signup-form{display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto}
  .field input,.field select{
    width:100%;padding:18px 20px;
    border:1px solid var(--hair);background:#fff;
    border-radius:3px;color:var(--text);font-size:15.5px;
    transition:border-color var(--t-fast);
  }
  .field input::placeholder,
  .field select{color:var(--text-3)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);color:var(--text)}
  .field select{
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23777' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 18px center;background-size:14px;
    padding-right:48px;
  }
  .field select.is-set{color:var(--text)}

  .phone-field{
    display:flex;align-items:center;
    border:1px solid var(--hair);border-radius:3px;background:#fff;
    transition:border-color var(--t-fast);overflow:hidden;
  }
  .phone-field:focus-within{border-color:var(--accent)}
  .cc{
    display:flex;align-items:center;gap:8px;
    padding:18px 14px;border-right:1px solid var(--hair);
    cursor:pointer;background:transparent;font-size:15.5px;color:var(--text);
  }
  .cc .flag{
    width:26px;height:19px;display:inline-block;
    background:linear-gradient(to bottom,
      #b22234 0%,#b22234 11%,#fff 11%,#fff 22%,
      #b22234 22%,#b22234 33%,#fff 33%,#fff 44%,
      #b22234 44%,#b22234 55%,#fff 55%,#fff 66%,
      #b22234 66%,#b22234 77%,#fff 77%,#fff 88%,
      #b22234 88%,#b22234 100%);
    border:1px solid #ccc;border-radius:2px;position:relative;
  }
  .cc .flag::before{
    content:"";position:absolute;left:0;top:0;
    width:11px;height:10px;background:#3c3b6e;
  }
  .cc .chev{width:11px;height:11px;color:var(--text-2)}
  .cc-prefix{font-weight:500;color:var(--text);margin-left:2px}
  .phone-field input{
    flex:1;border:0;outline:none;padding:18px 20px;background:transparent;
  }

  .submit-btn{
    width:100%;padding:18px;background:var(--accent);color:#fff;
    border-radius:3px;font-size:15.5px;font-weight:600;
    letter-spacing:.02em;margin-top:18px;
    transition:background var(--t-fast);
  }
  .submit-btn:hover{background:var(--accent-dark)}

  /* Footer */
  footer.site-footer{background:#F2F0EC;color:#5B5B58;border-top:1px solid #E5E2DA;padding:0}
  .ft-bottom{padding:16px 0;background:#EAE7DF;font-size:13.5px;color:#5B5B58}
  .ft-bottom .wrap{max-width:1320px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  .ft-bottom a{color:#5B5B58;margin-left:22px;text-decoration:none}
  .ft-bottom a:hover{color:#1F1F1F}
</style>
</head>
<body>

<div class="topbar"></div>

<main class="signup-page">
  <div class="signup-card">

    <div class="sp-head">
      <a class="sp-back" href="login.html" aria-label="Back to login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1 class="sp-title">Sign up as a new customer</h1>
    </div>

    <div class="stepper">
      <div class="step-dot">1</div>
      <div class="step-label">Basic Details</div>
    </div>

    <form class="signup-form" onsubmit="event.preventDefault();location.href='profile.html'">
      <div class="field"><input type="text" placeholder="Company name*" required></div>
      <div class="field"><input type="text" placeholder="First Name*" required></div>
      <div class="field"><input type="text" placeholder="Last Name"></div>
      <div class="field">
        <div class="phone-field">
          <button type="button" class="cc" aria-label="Select country">
            <span class="flag" aria-hidden="true"></span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            <span class="cc-prefix">+1</span>
          </button>
          <input type="tel" placeholder="Phone number">
        </div>
      </div>
      <div class="field"><input type="email" placeholder="Email*" required></div>
      <div class="field">
        <select onchange="this.classList.toggle('is-set', this.value!=='')">
          <option value="">Business Type</option>
          <option>Interior Designer</option>
          <option>Retailer / Dealer</option>
          <option>Architect</option>
          <option>Contractor / Builder</option>
          <option>Hospitality</option>
          <option>Other</option>
        </select>
      </div>

      <button class="submit-btn" type="submit">Submit request</button>
    </form>

  </div>
</main>

<footer class="site-footer">
  <div class="ft-bottom">
    <div class="wrap">
      <span>Powered by Wizcommerce. All rights reserved.</span>
      <span>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms &amp; Conditions</a>
        <a href="#">Accessibility</a>
      </span>
    </div>
  </div>
</footer>

</body>
</html>
